      - type: reading
        title: Summary
        path: sections/section-010/module-02/course-03-summary.md

      - type: reading
        title: 'Module 3: Triage With Severity, Category & the Report Lifecycle'
        path: sections/section-010/module-03/course.md

      - type: reading
        title: 'Module 3.1: Severity and Category in Results'
        path: sections/section-010/module-03/course-01-severity-and-category-in-results.md

      - type: reading
        title: 'Module 3.2: Report Lifecycle and Tooling'
        path: sections/section-010/module-03/course-02-report-lifecycle-and-tooling.md

      - type: reading
        title: Question
        path: sections/section-010/module-03/labs/lab-01/question.md
      - type: lab
        title: Report Triage Lab
        path: sections/section-010/module-03/labs/lab-01
        difficulty: intermediate
        estimated_duration: 25m
