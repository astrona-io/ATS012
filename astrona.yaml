training:
  id: ATS012
  title: "KCA: Policy Management"
  description: >
    Training material covering the Kyverno Certified Associate (KCA)
    Policy Management domain — policy reports, policy exceptions and
    Kyverno metrics — with hands-on labs for each competency.

  certification:
    name: Kyverno Certified Associate
    code: KCA
    provider: CNCF / Linux Foundation
    domain: Policy Management

modules:
  - id: module-010
    title: "Section 010: Policy Reports"
    description: >
      Read PolicyReport and ClusterPolicyReport objects, interpret the five
      result types, and operate the reporting pipeline that produces them —
      the admission path, the background scan, and the flags that tune both.

    content:
