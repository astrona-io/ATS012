# Course manifest for ATS012 - KCA: Policy Management (Kyverno Certified Associate).
#
# One entry per section under `modules:`. Each section lists, in order: its
# README, then for each module the landing page (course.md), its parts
# (course-0N-*.md), the lab's question.md reading and the `type: lab` entry,
# then the module's summary. The section capstone closes the section,
# followed by the section quiz. Playgrounds are not listed: the landing
# page's playground marker shows them. solution.md is never listed.
#
# All labs are UNTESTED: built and checked statically only.
#
# Every `path:` is relative to this file.

training:
  id: ATS012
  title: "KCA: Policy Management"
  description: >
    Training material covering the Kyverno Certified Associate (KCA)
    Policy Management domain: policy reports, policy exceptions and
    Kyverno metrics. Each module pairs a layered reader with an ungraded
    hands-on playground and a graded lab. Each section closes with an
    integration capstone and a knowledge-check quiz, and the course ends
    with a final domain quiz.

  certification:
    name: Kyverno Certified Associate
    code: KCA
    provider: CNCF / Linux Foundation
    domain: Policy Management
    competencies:
      - "Reading PolicyReports and ClusterPolicyReports, and operating the reports pipeline"
      - "Using severity, category and the report lifecycle to triage findings"
      - "Enabling, writing, narrowing and governing PolicyExceptions"
      - "Time-boxing exceptions and cleaning them up"
      - "Scraping and configuring Kyverno metrics and controlling cardinality"
      - "Querying metrics and writing alert rules"

modules:

  - id: module-010
    title: 'Section 010: Policy Reports'
    description: >
      Read PolicyReport and ClusterPolicyReport objects, interpret the five
      result types, operate the reporting pipeline that produces them, and
      use severity, category and the report lifecycle to triage findings.

    content:
      - type: reading
        title: Section Overview
        path: sections/section-010/README.md

      - type: reading
        title: 'Module 1: Reading PolicyReports'
        path: sections/section-010/module-01/course.md

      - type: reading
        title: 'Module 1.1: PolicyReport and ClusterPolicyReport'
        path: sections/section-010/module-01/course-01-policyreport-and-clusterpolicyreport.md

      - type: reading
        title: 'Module 1.2: Reading Results: the Five Result Types'
        path: sections/section-010/module-01/course-02-reading-results-and-result-types.md

      - type: reading
        title: Question
        path: sections/section-010/module-01/labs/lab-01/question.md
      - type: lab
        title: Reading PolicyReports Lab
        path: sections/section-010/module-01/labs/lab-01
        difficulty: beginner
        estimated_duration: 20m
        topic: reports
        task_kind: explore
        tags: [policyreport, clusterpolicyreport, audit, warn, jsonpath]
        learning_goals:
          - Find the PolicyReport a policy produced for a namespace
          - Separate fail results from pass results and from advisory warn results
          - Query a report with kubectl and jsonpath
        resources:
          - name: Kyverno policy reports
            url: https://kyverno.io/docs/policy-reports/
      - type: reading
        title: Summary
        path: sections/section-010/module-01/course-03-summary.md

      - type: reading
        title: 'Module 2: The Reports Pipeline & Its Tuning'
        path: sections/section-010/module-02/course.md

      - type: reading
        title: 'Module 2.1: The Reports Pipeline'
        path: sections/section-010/module-02/course-01-the-reports-pipeline.md

      - type: reading
        title: 'Module 2.2: Tuning and Troubleshooting Reports'
        path: sections/section-010/module-02/course-02-tuning-and-troubleshooting-reports.md

      - type: reading
        title: Question
        path: sections/section-010/module-02/labs/lab-01/question.md
      - type: lab
        title: Reports Pipeline Tuning Lab
        path: sections/section-010/module-02/labs/lab-01
        difficulty: intermediate
