        path: sections/section-010/capstone/labs/lab-01/question.md
      - type: lab
        title: Policy Reports Capstone Lab
        path: sections/section-010/capstone/labs/lab-01
        difficulty: advanced
        estimated_duration: 40m
        topic: reports
        task_kind: build
        tags: [policyreport, scored, warn, scan-interval]
        learning_goals:
