metadata:
  name: "ats-012-lab-001"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "lab-001-setup"
      description: "Creates the platform-ns namespace for the lab"
      type: "file"
      source: "bootstrap/02-create-namespace.sh"

validation:
  scripts:
    - name: "verify-policy-reports"
      description: "Confirms the scored and advisory policies are live in Audit mode and that the violating Pod's PolicyReport records a fail and a warn while the compliant Pod records neither"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
