metadata:
  name: "ats-012-lab-010"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "lab-010-setup"
      description: "Creates team-red, team-blue and platform-ns, three Pods, and a one-minute background scan interval"
      type: "file"
      source: "bootstrap/02-seed.sh"

validation:
  scripts:
    - name: "policies-carry-severity-and-category"
      description: "Confirms both Audit policies exist with the right rules, namespaces, severity and category annotations"
      type: "file"
      source: "validation/01-policies.sh"
    - name: "red-bad-removed-with-its-report"
      description: "Confirms red-bad was deleted, its report is gone, and blue-bad has recorded results"
      type: "file"
      source: "validation/02-lifecycle.sh"
    - name: "triage-summary-matches-reports"
      description: "Confirms the triage-summary ConfigMap holds the live count of fail results per severity"
      type: "file"
      source: "validation/03-triage-summary.sh"

teardown:
  keepCluster: false
