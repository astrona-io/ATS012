# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Testing Policies with the Kyverno CLI (PLAYGROUND) - playground environment.
# A clean sandbox: it installs the Kyverno CLI v1.13.2 and a sample policy with
# two Pods, then stays running for free exploration. No task, no grading, no
# `astrona submit`. No cluster workloads are needed; the CLI works on files.
apiVersion: astrona.io/v1
metadata:
  name: ats-012-playground-040-01
  docs:
    guide: docs/overview.md

bootstrap:
  init:
    - name: install-kyverno-cli
      description: Installs the Kyverno CLI v1.13.2
      type: file
      source: bootstrap/01-install-kyverno-cli.sh
    - name: seed-playground
      description: Writes a sample policy and two Pods to /opt/kyverno-lab
      type: file
      source: bootstrap/02-seed.sh

teardown:
  keepCluster: false
