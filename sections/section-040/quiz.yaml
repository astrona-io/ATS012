# Knowledge check for section 040. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats012-040
course_id: ATS012
exam_code: KCA
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-040
  title: Policy Testing with the Kyverno CLI
questions:
- id: ats012-040-q01
  type: single_choice
  difficulty: beginner
  learning_objective: "Say what kyverno apply does"
  source_readings:
  - sections/section-040/module-01/course-01-running-a-policy-with-kyverno-apply.md
  prompt: "What does `kyverno apply policy.yaml --resource pods.yaml` do?"
  options:
  - id: a
    text: "It evaluates the policy against the files and prints results, without changing a cluster."
    explanation: "Correct."
  - id: b
    text: "It installs the policy in the current cluster."
    explanation: "This option does not match what Kyverno does."
  - id: c
    text: "It deletes resources that fail."
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "It creates a PolicyReport in the cluster."
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "`kyverno apply` evaluates locally. Use `--cluster` to read live resources, and it still does not change them."
- id: ats012-040-q02
  type: single_choice
  difficulty: beginner
  learning_objective: "Name the test file and its kind"
  source_readings:
  - sections/section-040/module-01/course-02-writing-kyverno-test-yaml.md
  prompt: "Which file name and kind does `kyverno test` look for by default?"
  options:
  - id: a
    text: "`kyverno-test.yaml` with `kind: Test`"
    explanation: "Correct."
  - id: b
    text: "`policy-test.yaml` with `kind: PolicyTest`"
    explanation: "This option does not match what Kyverno does."
  - id: c
    text: "`kyverno.yaml` with `kind: ClusterPolicy`"
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "`test.json` with `kind: Report`"
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "By default `kyverno test` searches for files named `kyverno-test.yaml`; `--file-name` changes the name."
- id: ats012-040-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: "Predict the test result for an unexpected outcome"
  source_readings:
  - sections/section-040/module-01/course-02-writing-kyverno-test-yaml.md
  prompt: "A policy produces a result for a resource, but `results` has no expectation for it. What does the test report?"
  options:
  - id: a
    text: "A failure for the unexpected outcome."
    explanation: "Correct."
  - id: b
    text: "Nothing; unlisted results are ignored."
    explanation: "This option does not match what Kyverno does."
  - id: c
    text: "A pass, because the policy ran."
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "A warning only."
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "A test is a complete statement of what the policy does to the sample resources, so unlisted outcomes fail it."
- id: ats012-040-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: "Name the rule of an autogenerated rule"
  source_readings:
  - sections/section-040/module-01/course-02-writing-kyverno-test-yaml.md
  prompt: "A rule named `check-limits` is autogenerated for Deployments. What name does the expectation use for a Deployment resource?"
  options:
  - id: a
    text: "`autogen-check-limits`"
    explanation: "Correct."
  - id: b
    text: "`check-limits-deployment`"
    explanation: "This option does not match what Kyverno does."
  - id: c
    text: "`deployment-check-limits`"
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "`check-limits`"
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "Autogenerated rules for Pod controllers carry the `autogen-` prefix."
- id: ats012-040-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: "Test a mutate rule"
  source_readings:
  - sections/section-040/module-01/course-03-variables-mutate-and-generate-tests.md
  prompt: "Which field lets a test compare a mutate rule's output with an expected resource?"
  options:
  - id: a
    text: "`patchedResource`"
    explanation: "Correct."
  - id: b
    text: "`generatedResource`"
    explanation: "This is for generate rules."
  - id: c
    text: "`mutatedFile`"
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "`expectedPatch`"
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "`patchedResource` names the file with the resource as it should look after mutation."
- id: ats012-040-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: "Test a generate rule"
  source_readings:
  - sections/section-040/module-01/course-03-variables-mutate-and-generate-tests.md
  prompt: "Which field names the file with the resource a generate rule should create?"
  options:
  - id: a
    text: "`generatedResource`"
    explanation: "Correct."
  - id: b
    text: "`patchedResource`"
    explanation: "This is for mutate rules."
  - id: c
    text: "`createdResource`"
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "`downstream`"
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "`generatedResource` holds the expected generated resource."
- id: ats012-040-q07
  type: single_choice
  difficulty: advanced
  learning_objective: "Supply variables to a test"
  source_readings:
  - sections/section-040/module-01/course-03-variables-mutate-and-generate-tests.md
  prompt: "A rule reads a variable that is not in the resource. How do you give the CLI a value?"
  options:
  - id: a
    text: "With a `Values` file passed as `--values-file` or `values:` in the Test."
    explanation: "Correct."
  - id: b
    text: "Edit the policy to remove the variable."
    explanation: "This option does not match what Kyverno does."
  - id: c
    text: "Set an environment variable named after it."
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "The CLI looks it up in the cluster automatically."
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "A `Values` file (or `--set` for a single value) provides the data that a request would carry."
- id: ats012-040-q08
  type: single_choice
  difficulty: beginner
  learning_objective: "Use the exit code in a pipeline"
  source_readings:
  - sections/section-040/module-01/course-04-running-tests-in-ci.md
  prompt: "What does `kyverno test` return when an expectation fails?"
  options:
  - id: a
    text: "A non-zero exit code."
    explanation: "Correct."
  - id: b
    text: "Exit code 0, with a message."
    explanation: "This option does not match what Kyverno does."
  - id: c
    text: "It deletes the failing resource."
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "Nothing; it only prints a table."
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "The non-zero exit code makes a CI step fail without extra parsing."
- id: ats012-040-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: "Run one test case"
  source_readings:
  - sections/section-040/module-01/course-04-running-tests-in-ci.md
  prompt: "Which flag runs only part of a test, such as one rule on one resource?"
  options:
  - id: a
    text: "`--test-case-selector`"
    explanation: "Correct."
  - id: b
    text: "`--only`"
    explanation: "This option does not match what Kyverno does."
  - id: c
    text: "`--skip-cluster`"
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "`--dry-run`"
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "`--test-case-selector \"policy=...,rule=...,resource=...\"` filters the results to run."
- id: ats012-040-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: "Know what CLI tests cannot show"
  source_readings:
  - sections/section-040/module-01/course-04-running-tests-in-ci.md
  prompt: "Which behavior can `kyverno test` NOT verify?"
  options:
  - id: a
    text: "How the reports controller or a PolicyException behaves in a live cluster."
    explanation: "Correct."
  - id: b
    text: "Whether a validate rule passes for a Pod file."
    explanation: "This option does not match what Kyverno does."
  - id: c
    text: "Whether a mutate rule produces the expected Pod."
    explanation: "This option does not match what Kyverno does."
  - id: d
    text: "Whether a policy file parses."
    explanation: "This option does not match what Kyverno does."
  correct_option: a
  explanation: "The CLI works on files. Cluster behavior needs a test on a cluster."
