metadata:
  name: "ats-012-lab-007"
  docs:
    solution: "solution.md"
    question: "question.md"

bootstrap:
  init:
    - name: "install-kyverno"
      description: "Installs Kyverno onto the kind cluster"
      type: "file"
      source: "bootstrap/01-install-kyverno.sh"
    - name: "lab-007-setup"
      description: "Creates metrics-ns and a long-lived curl probe Pod for scraping the metrics endpoint from inside the cluster"
      type: "file"
      source: "bootstrap/02-setup-metrics-lab.sh"

validation:
  scripts:
    - name: "verify-metrics-endpoint-and-families"
      description: "Confirms the Enforce policy admitted one Pod and rejected another, and that the policy inventory and both results are visible on the metrics endpoint"
      type: "file"
      source: "validation/validate-completed.sh"

teardown:
  keepCluster: false
